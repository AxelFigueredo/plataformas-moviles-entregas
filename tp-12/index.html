<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editor de Texto - DOM y JavaScript</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>
<body>
    <div class="container my-1 my-sm-2 my-md-4 my-lg-5">
        <h1>Editor de Texto</h1>
        <div class="card shadow-sm">
            <div class="card-body">
                <h2>Texto</h2>

                <!-- Visualizador del texto -->
                <p class="texto" id="texto">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Donec elementum auctor libero, vel imperdiet est. Etiam blandit facilisis ex, nec cursus metus pharetra quis. Fusce imperdiet nisl nibh, ac aliquet ante elementum vitae.</p>

                <hr class="hr">

                <h2>Opciones de Formato</h2>
                <div class="row g-2">
                    <!-- Negrita -->
                    <div class="col-6 col-md-3 my-1">
                        <button id="btn-negrita" class="btn d-block w-100 btn-outline-primary" data-formato="negrita">
                            Bold (Negrita)
                        </button>
                    </div>
                    <!-- Cursiva -->
                    <div class="col-6 col-md-3 my-1">
                        <button id="btn-cursiva" class="btn d-block w-100 btn-outline-primary" data-formato="cursiva">
                            Italic (Cursiva)
                        </button>
                    </div>
                    <!-- Subrayado -->
                    <div class="col-6 col-md-3 my-1">
                        <button id="btn-subrayado" class="btn d-block w-100 btn-outline-primary" data-formato="subrayado">
                            Underline (Subrayado)
                        </button>
                    </div>
                    <!-- Estilo Adicional: Color -->
                    <div class="col-6 col-md-3 my-1">
                        <button id="btn-color" class="btn d-block w-100 btn-outline-primary" data-formato="color">
                            Color Rojo
                        </button>
                    </div>
                </div>

                <hr class="hr">

                <!-- Edición de texto y tamaño -->
                <div class="row g-3">
                    <div class="col-12 col-md-8">
                        <label for="input-texto" class="form-label fw-bold">Editar Contenido:</label>
                        <input type="text" id="input-texto" class="form-control" value="Lorem ipsum dolor sit amet, consectetur adipiscing elit. Donec elementum auctor libero, vel imperdiet est. Etiam blandit facilisis ex, nec cursus metus pharetra quis. Fusce imperdiet nisl nibh, ac aliquet ante elementum vitae.">
                    </div>
                    <div class="col-12 col-md-4">
                        <label for="select-tamanio" class="form-label fw-bold">Tamaño de Texto:</label>
                        <select id="select-tamanio" class="form-select">
                            <option value="1rem">Normal</option>
                            <option value="1.25rem">Mediano</option>
                            <option value="1.5rem">Grande</option>
                            <option value="2rem">Muy Grande</option>
                        </select>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
    <script type="text/javascript">
        // Referencias a los elementos del DOM
        const pTexto = document.getElementById('texto');
        const inputTexto = document.getElementById('input-texto');
        const selectTamanio = document.getElementById('select-tamanio');

        // Referencias a los botones
        const btnNegrita = document.getElementById('btn-negrita');
        const btnCursiva = document.getElementById('btn-cursiva');
        const btnSubrayado = document.getElementById('btn-subrayado');
        const btnColor = document.getElementById('btn-color');

        /**
         * Actualiza visualmente el estado del botón (Activo/Inactivo)
         */
        function actualizarEstadoBoton(boton, activo) {
            if (activo) {
                boton.classList.remove('btn-outline-primary');
                boton.classList.add('btn-primary');
            } else {
                boton.classList.remove('btn-primary');
                boton.classList.add('btn-outline-primary');
            }
        }

        /**
         * funcionNegrita()
         * Alterna el estilo negrita en el párrafo y actualiza el botón.
         */
        function funcionNegrita() {
            const activo = pTexto.style.fontWeight === 'bold';
            pTexto.style.fontWeight = activo ? 'normal' : 'bold';
            actualizarEstadoBoton(btnNegrita, !activo);
        }

        /**
         * funcionCursiva()
         * Alterna el estilo cursiva en el párrafo y actualiza el botón.
         */
        function funcionCursiva() {
            const activo = pTexto.style.fontStyle === 'italic';
            pTexto.style.fontStyle = activo ? 'normal' : 'italic';
            actualizarEstadoBoton(btnCursiva, !activo);
        }

        /**
         * funcionSubrayado()
         * Alterna el estilo subrayado en el párrafo y actualiza el botón.
         */
        function funcionSubrayado() {
            const activo = pTexto.style.textDecoration === 'underline';
            pTexto.style.textDecoration = activo ? 'none' : 'underline';
            actualizarEstadoBoton(btnSubrayado, !activo);
        }

        /**
         * funcionColor()
         * Estilo adicional: Alterna el color del texto entre rojo y el color por defecto.
         */
        function funcionColor() {
            const activo = pTexto.style.color === 'red';
            pTexto.style.color = activo ? '' : 'red';
            actualizarEstadoBoton(btnColor, !activo);
        }

        // Sincronizar el input de texto en tiempo real con el párrafo
        inputTexto.addEventListener('input', (e) => {
            pTexto.textContent = e.target.value;
        });

        // Modificar el tamaño del texto mediante el select
        selectTamanio.addEventListener('change', (e) => {
            pTexto.style.setProperty('font-size', e.target.value, 'important');
        });

        function handlerBoton(e) {
            // Obtiene el valor del atributo "data-formato" del botón que disparó el evento
            const funcionBoton = e.target.dataset.formato;
            switch (funcionBoton) {
                case 'negrita':
                    funcionNegrita();
                    break;
                case 'cursiva':
                    funcionCursiva();
                    break;
                case 'subrayado':
                    funcionSubrayado();
                    break;
                case 'color':
                    funcionColor();
                    break;
            }
        }
        
        document.querySelectorAll('button.btn[data-formato]').forEach(e => e.addEventListener('click', handlerBoton));
    </script>
</body>
</html>
